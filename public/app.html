<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kothaa Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Animated aurora backdrop, always present behind every screen -->
  <div class="backdrop" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="grid-veil"></div>
  </div>

  <!-- Auth screen: choose Google or Guest -->
  <div id="auth-screen" class="screen">
    <div class="card-wrap">
      <div class="glow-frame">
        <div class="card">
          <div class="card-head">
            <span class="brand">
              <span class="brand-icon badge-pulse">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></svg>
              </span>
              <span class="brand-name">kothaa</span>
            </span>
            <h1>Welcome to Kothaa</h1>
            <p class="sub">Sign in to keep your name and chat history, or jump in as a guest.</p>
          </div>

          <div class="form">
            <a href="/auth/google" class="btn-google field-in" style="animation-delay:120ms">
              <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.5-5.2l-6.2-5.3C29.4 35.4 26.8 36 24 36c-5.3 0-9.8-3.4-11.3-8.1l-6.5 5C9.6 39.5 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.3C39.9 36.9 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
              Sign in with Google
            </a>
            <button id="guest-btn" class="btn-outline field-in" style="animation-delay:220ms">Continue as Guest</button>
          </div>

          <div class="live field-in" style="animation-delay:420ms">
            <span class="live-dot"></span>
            <span>1,240 rooms active today</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Room join screen: shown after auth -->
  <div id="join-screen" class="screen hidden">
    <div class="card-wrap">
      <div class="glow-frame">
        <div class="card">
          <div class="card-head">
            <span class="brand">
              <span class="brand-icon badge-pulse">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></svg>
              </span>
              <span class="brand-name">kothaa</span>
            </span>
            <h1>Join a Chatroom</h1>
            <p id="signed-in-as" class="sub"></p>
          </div>

          <form id="join-form" class="form">
            <label class="field field-in" style="animation-delay:120ms">
              <span class="field-label">Room name</span>
              <input id="room-input" class="field-input" placeholder="e.g. general" maxlength="24" autocomplete="off" />
            </label>

            <button id="join-btn" type="submit" class="join-btn field-in" style="animation-delay:220ms">
              <span class="join-btn-sheen" aria-hidden="true"></span>
              <span class="join-btn-inner">
                <span class="btn-label">Join room</span>
                <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
              </span>
            </button>
          </form>

          <a href="/auth/logout" id="logout-link-join" class="logout-link field-in" style="animation-delay:320ms">Log out</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Chat screen -->
  <div id="chat-screen" class="screen hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon small">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></svg>
        </span>
        <span class="brand-name small">kothaa</span>
      </div>
      <div class="sidebar-header">
        <h2 id="room-title">Room</h2>
        <button id="theme-toggle" title="Toggle theme">🌙</button>
      </div>
      <h3>Online</h3>
      <ul id="user-list"></ul>
      <a href="/auth/logout" class="logout-link sidebar-logout">Log out</a>
    </aside>

    <main class="chat-main">
      <div id="messages" class="messages"></div>
      <div id="typing-indicator" class="typing-indicator"></div>
      <div id="emoji-panel" class="emoji-panel hidden"></div>
      <form id="message-form" class="message-form">
        <button type="button" id="emoji-btn" title="Emoji">😊</button>
        <input id="message-input" type="text" placeholder="Type a message..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
