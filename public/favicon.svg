<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="kothaa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5722" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff5722" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Glow / Squircle Container -->
  <rect x="8" y="8" width="112" height="112" rx="32" fill="url(#kothaa-grad)" filter="url(#shadow)" />
  
  <!-- Chat Speech Bubble -->
  <path d="M42.4 96 A 40 40 0 1 0 24 78.4 L 16 104 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Three playful dots inside chat bubble -->
  <circle cx="48" cy="62" r="4.5" fill="#ffffff" />
  <circle cx="64" cy="62" r="4.5" fill="#ffffff" />
  <circle cx="80" cy="62" r="4.5" fill="#ffffff" />
</svg>
